services:
  # Base de Datos
  db:
    image: mysql:8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - nalu_mysql_data:/var/lib/mysql
    # ESTO HACE QUE MYSQL AVISE CUANDO ESTÁ 100% LISTO 
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASS}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tu servidor Node.js
  backend:
    build: ./Back-end
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    # � espera a que el servicio esté "healthy" �
    depends_on:
      db:
        condition: service_healthy
    # � CONECTADO EN TIEMPO REAL �
    volumes:
      - ./Back-end:/app
      - /app/node_modules

  # Tu App React
  frontend:
    build: ./Front-end
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    # � TU FRONTEND CONECTADO EN TIEMPO REAL �
    volumes:
      - ./Front-end:/app
      - /app/node_modules

volumes:
  nalu_mysql_data:
